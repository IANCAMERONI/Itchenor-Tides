<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Itchenor Tide &mdash; Bridge Display</title>
<meta name="description" content="A luxury yacht-style tide screensaver for Itchenor, West Sussex.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e11">

<!-- Installable as a home-screen app (PWA) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Itchenor Tide">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sea.css">
<link rel="stylesheet" href="css/curve.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<div id="app" class="app">

  <!-- Ambient brass vignette / plate texture -->
  <div class="vignette" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <!-- Header plate: location + live clock -->
  <header class="bridge-header">
    <div class="header-left">
      <div class="brand-mark" aria-hidden="true">&#x2693;</div>
      <div class="location-block">
        <h1 class="location-name">Itchenor</h1>
        <p class="location-sub">Chichester Harbour &middot; West Sussex, UK</p>
      </div>
    </div>

    <div class="header-center">
      <div class="status-pill" id="status-pill" data-state="loading">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-text" id="status-text">Acquiring tidal data&hellip;</span>
      </div>
    </div>

    <div class="header-right">
      <div class="clock-block">
        <div class="clock-time" id="clock-time">--:--</div>
        <div class="clock-date" id="clock-date">&mdash;</div>
      </div>
    </div>
  </header>

  <!-- Main instrument: the sea itself — a window onto the water, whose -->
  <!-- level is driven directly by the current tide height.              -->
  <main class="bridge-main">

    <section class="sea-window" aria-label="Water level">
      <canvas id="sea-canvas"></canvas>

      <div class="sea-readout" id="sea-readout">
        <div class="sea-readout-value">
          <span id="current-height">&ndash;.&ndash;</span><span class="sea-readout-unit">m</span>
        </div>
        <div class="sea-readout-state" id="current-trend">
          <span class="trend-arrow" id="trend-arrow" aria-hidden="true">&#8599;</span>
          <span id="trend-text">&mdash;</span>
          <span class="sea-readout-rate" id="trend-rate"></span>
        </div>
        <div class="sea-readout-countdowns">
          <div class="countdown-stat">
            <div class="countdown-label">High Water In</div>
            <div class="countdown-value" id="high-countdown">&ndash;</div>
          </div>
          <div class="countdown-stat">
            <div class="countdown-label">Low Water In</div>
            <div class="countdown-value" id="low-countdown">&ndash;</div>
          </div>
        </div>
      </div>

      <div class="sea-hud sea-hud-left" id="event-card-1">
        <div class="event-type">Next High Tide</div>
        <div class="event-time" id="event-1-time">--:--</div>
        <div class="event-height"><span id="event-1-height">&ndash;.&ndash;</span> m</div>
      </div>
      <div class="sea-hud sea-hud-right" id="event-card-2">
        <div class="event-type">Next Low Tide</div>
        <div class="event-time" id="event-2-time">--:--</div>
        <div class="event-height"><span id="event-2-height">&ndash;.&ndash;</span> m</div>
      </div>
    </section>

    <section class="tide-curve-wrap" aria-label="24 hour tide curve">
      <canvas id="tide-curve-canvas"></canvas>
    </section>

  </main>

  <!-- Footer plate: coordinates, datum, moon phase, fullscreen hint -->
  <footer class="bridge-footer">
    <div class="footer-item">
      <span class="footer-label">Position</span>
      <span class="footer-value" id="footer-position">50&deg;47.9&prime; N &nbsp; 000&deg;52.1&prime; W</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Datum</span>
      <span class="footer-value" id="footer-datum">Chart Datum</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Moon</span>
      <span class="footer-value" id="footer-moon">&mdash;</span>
    </div>
    <div class="footer-item">
      <span class="footer-label">Data Updated</span>
      <span class="footer-value" id="footer-updated">&mdash;</span>
    </div>
    <button class="fullscreen-hint" id="fullscreen-toggle" type="button" aria-label="Toggle fullscreen">
      <span id="fullscreen-hint-text">Enter Fullscreen</span>
    </button>
  </footer>

</div>

<script src="js/config.js"></script>
<script src="js/tideMath.js"></script>
<script src="js/tideService.js"></script>
<script src="js/seaWindow.js"></script>
<script src="js/tideCurve.js"></script>
<script src="js/clock.js"></script>
<script src="js/fullscreen.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
